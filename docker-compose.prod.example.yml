# Prod-shaped overlay: closes every service port except the gateway's.
#
#   cp docker-compose.example.yml docker-compose.yml
#   cp docker-compose.prod.example.yml docker-compose.prod.yml
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d
#
# This overlay is what makes the Phase-6 trust model real. Services accept `x-user-id` from
# anyone who can reach them; the gateway is trustworthy only because it is the ONLY reachable
# entry point. With ports published (the default dev file) a local caller can still bypass it.
services:
  # Datastores and brokers are internal-only too: in this shape nothing but the gateway is
  # reachable from the host, so a bypass has to come from inside the compose network.
  postgres:
    ports: !reset []
  kafka:
    ports: !reset []
  rabbitmq:
    ports: !reset []
  redis:
    ports: !reset []
  mailpit:
    ports: !reset []
  # Observability is operator-facing, not public: in this shape you reach Prometheus
  # and Grafana through the compose network (or an SSH tunnel), never from the host.
  prometheus:
    ports: !reset []
  grafana:
    ports: !reset []
  jaeger:
    ports: !reset []

  hello:
    ports: !reset []
  inventory:
    ports: !reset []
  order:
    ports: !reset []
  payment:
    ports: !reset []
  catalog:
    ports: !reset []
  notification:
    ports: !reset []
  identity:
    ports: !reset []
  gateway:
    environment:
      COOKIE_SECURE: "true" # cookies only over https once a TLS terminator is in front
    ports: ["8000:8000"]

  # The storefront, defined only here: dev keeps the Vite dev server, because HMR is the reason
  # it exists and containerising dev trades it for nothing. A service introduced by an overlay
  # is still created, so no change to the base file is needed.
  #
  # Published, because it is the human entry point. The gateway keeps its own published port:
  # the payment provider's webhook is an inbound call that does not pass through nginx.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on: [gateway]
    ports: ["8080:80"]
    restart: unless-stopped
    profiles: ["app"]
