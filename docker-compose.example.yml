# Copy to docker-compose.yml (gitignored) before running:  cp docker-compose.example.yml docker-compose.yml
name: ecom-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom}
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecom}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on: [kafka]

  rabbitmq:
    image: rabbitmq:4-management
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ecom}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ecom}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]   # 1025 = SMTP, 8025 = web UI
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/livez"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Tags are pinned, not :latest — checkout.json is version-coupled to the Grafana
  # that renders it, so a moving tag would break the committed dashboard on a clone.
  prometheus:
    image: prom/prometheus:v3.13.1
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:13.1.1
    restart: unless-stopped
    ports: ["3007:3000"]   # 3000-3006 are taken by the services
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-ecom}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    ports: ["16686:16686"]   # UI only — OTLP stays in-network, like the gateway's metrics port
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Application services live behind the `app` profile so `docker compose up`
  # brings up only infra by default:  docker compose --profile app up -d hello
  hello:
    profiles: ["app"]
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/hello/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecom}:${POSTGRES_PASSWORD:-ecom}@postgres:5432/hello
      KAFKA_BROKERS: kafka:19092
      REDIS_URL: redis://redis:6379
      PORT: 3000
      OTEL_SERVICE_NAME: hello
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      NODE_OPTIONS: --import tsx --import file:///repo/packages/shared/src/tracing.ts
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  inventory:
    profiles: ["app"]
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecom}:${POSTGRES_PASSWORD:-ecom}@postgres:5432/inventory
      KAFKA_BROKERS: kafka:19092
      REDIS_URL: redis://redis:6379
      RESERVATION_TTL_MS: 900000
      SWEEP_INTERVAL_MS: 5000
      PORT: 3001
      OTEL_SERVICE_NAME: inventory
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      NODE_OPTIONS: --import tsx --import file:///repo/packages/shared/src/tracing.ts
    ports: ["3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  order:
    profiles: ["app"]
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/order/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecom}:${POSTGRES_PASSWORD:-ecom}@postgres:5432/order
      KAFKA_BROKERS: kafka:19092
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-ecom}:${RABBITMQ_PASSWORD:-ecom}@rabbitmq:5672
      PORT: 3002
      LOG_LEVEL: info
      OTEL_SERVICE_NAME: order
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      NODE_OPTIONS: --import tsx --import file:///repo/packages/shared/src/tracing.ts
    ports: ["3002:3002"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  payment:
    profiles: ["app"]
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecom}:${POSTGRES_PASSWORD:-ecom}@postgres:5432/payment
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-ecom}:${RABBITMQ_PASSWORD:-ecom}@rabbitmq:5672
      KAFKA_BROKERS: kafka:19092
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      PORT: 3003
      OTEL_SERVICE_NAME: payment
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      NODE_OPTIONS: --import tsx --import file:///repo/packages/shared/src/tracing.ts
    ports: ["3003:3003"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  catalog:
    profiles: ["app"]
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecom}:${POSTGRES_PASSWORD:-ecom}@postgres:5432/catalog
      KAFKA_BROKERS: kafka:19092
      PORT: 3004
      OTEL_SERVICE_NAME: catalog
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      NODE_OPTIONS: --import tsx --import file:///repo/packages/shared/src/tracing.ts
    ports: ["3004:3004"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  notification:
    profiles: ["app"]
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecom}:${POSTGRES_PASSWORD:-ecom}@postgres:5432/notification
      KAFKA_BROKERS: kafka:19092
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-ecom}:${RABBITMQ_PASSWORD:-ecom}@rabbitmq:5672
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      NOTIFY_EMAIL_DOMAIN: example.test
      PORT: 3005
      OTEL_SERVICE_NAME: notification
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      NODE_OPTIONS: --import tsx --import file:///repo/packages/shared/src/tracing.ts
    ports: ["3005:3005"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  identity:
    profiles: ["app"]
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecom}:${POSTGRES_PASSWORD:-ecom}@postgres:5432/identity
      KAFKA_BROKERS: kafka:19092
      # Generate the pair with services/identity/scripts/gen-jwt-keypair.sh; both values are
      # read from the gitignored compose environment file at the repo root.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      ACCESS_TTL: 15m
      REFRESH_TTL_DAYS: 7
      PORT: 3006
      OTEL_SERVICE_NAME: identity
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      NODE_OPTIONS: --import tsx --import file:///repo/packages/shared/src/tracing.ts
    ports: ["3006:3006"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3006/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The only service a browser should reach. In the `prod` profile it is also the only one
  # publishing a port — that network isolation is what makes the gateway's injected
  # x-user-id header trustworthy.
  gateway:
    profiles: ["app"]
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      IDENTITY_URL: http://identity:3006
      ORDER_URL: http://order:3002
      CATALOG_URL: http://catalog:3004
      PAYMENT_URL: http://payment:3003
      GRANTS_TTL_MS: 60000
      COOKIE_SECURE: "false"
      PORT: 8000
      # Deliberately not published: Prometheus reaches gateway:9464 over the compose
      # network, and /metrics stays unreachable from the host.
      METRICS_PORT: 9464
      OTEL_SERVICE_NAME: gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      NODE_OPTIONS: --import tsx --import file:///repo/packages/shared/src/tracing.ts
    ports: ["8000:8000"]
    depends_on:
      identity: { condition: service_healthy }
      order: { condition: service_healthy }
      catalog: { condition: service_healthy }
      payment: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
